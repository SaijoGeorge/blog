<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Art Styles Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes gleam {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .gleam-effect::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            animation: gleam 2s ease-in-out;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="border-b border-gray-200 bg-white sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 flex items-center justify-between py-4">
            <a href="https://saijogeorge.com" class="flex items-center gap-2 font-extrabold text-xl tracking-tight">
                <svg class="h-6 w-6 text-blue-600" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 2a10 10 0 1 0 10 10A10.011 10.011 0 0 0 12 2Zm1 14.59L8.71 12.3l1.42-1.42L13 12.76l4.88-4.88 1.42 1.42Z"></path>
                </svg>
                <span>Saijo George</span>
            </a>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-2">
        <!-- Header -->
        <div class="text-center mb-2">
            <h1 class="text-4xl font-bold text-gray-900 mb-2">AI Art Styles</h1>
            <p class="text-gray-600">Explore different AI image generation styles</p>
        </div>

        <!-- Search Bar -->
        <div class="sticky top-[54px] z-20 bg-gray-50 pb-2 pt-2 -mx-4 px-4">
            <div class="relative max-w-2xl mx-auto">
                <input 
                    type="text" 
                    id="searchInput"
                    placeholder="Search styles, descriptions, or prompts..."
                    class="w-full px-6 py-4 text-lg border-2 border-gray-300 rounded-full focus:outline-none focus:border-blue-500 shadow-sm bg-white"
                />
                <svg class="absolute right-6 top-1/2 transform -translate-y-1/2 w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
                    <!-- Results Count and Filter -->
        <div class="flex items-center justify-center gap-4 mb-2 mt-3">
            <div id="resultsCount" class="text-gray-600"></div>
            <label class="flex items-center gap-2 cursor-pointer relative" id="featuredLabel">
                <input type="checkbox" id="featuredToggle" class="w-4 h-4 text-blue-600 rounded focus:ring-2 focus:ring-blue-500" checked>
                <span class="text-sm text-gray-700 font-medium">Featured only</span>
            </label>
            <button id="settingsBtn" class="p-1.5 hover:bg-gray-200 rounded-lg transition-colors" title="Settings">
                <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </button>
        </div>
        </div>



        <!-- Grid Container -->
        <div id="gridContainer" class="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <!-- Items will be inserted here by JavaScript -->
        </div>

        <!-- No Results Message -->
        <div id="noResults" class="hidden text-center py-12">
            <p class="text-gray-500 text-xl">No styles found matching your search.</p>
        </div>
    </div>

    <!-- Image Modal -->
    <div id="imageModal" class="hidden fixed inset-0 bg-black bg-opacity-80 z-50 flex items-center justify-center p-4" onclick="closeModal()">
        <div class="relative max-w-7xl max-h-full">
            <button onclick="closeModal()" class="absolute -top-2 right-0 text-white hover:text-gray-300 text-4xl font-light">&times;</button>
            <img id="modalImage" src="" alt="" class="max-w-full max-h-[90vh] object-contain">
            <p id="modalCaption" class="text-white text-center mt-4 text-lg"></p>
        </div>
    </div>

    <!-- Settings Sidebar -->
    <div id="settingsSidebar" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 z-50">
        <div class="flex flex-col h-full">
            <div class="flex items-center justify-between p-4 border-b border-gray-200">
                <h2 class="text-xl font-bold text-gray-900">Settings</h2>
                <button id="closeSidebar" class="p-1 hover:bg-gray-100 rounded-lg transition-colors">
                    <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-4">
                <div class="mb-4">
                    <label for="customTerm" class="block text-sm font-semibold text-gray-700 mb-2">Custom Prompt Term</label>
                    <p class="text-xs text-gray-500 mb-3">Replace "mango" with your own term in all prompts. Use "a" or "an" automatically based on the first letter.</p>
                    <input
                        type="text"
                        id="customTerm"
                        placeholder="e.g., apple, orange, banana"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                    <button id="applyCustomTerm" class="mt-3 w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium">
                        Apply Changes
                    </button>
                    <button id="resetCustomTerm" class="mt-2 w-full px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors font-medium">
                        Reset to Default
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Sidebar Overlay -->
    <div id="sidebarOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40"></div>

    <script>
        // Data will be loaded from styles.json
        let aiStyles = [];
        let currentStyles = []; // Currently filtered/searched styles
        let displayedCount = 0; // Number of items currently rendered
        const INITIAL_LOAD = 80; // Initial number of items to render
        const LOAD_MORE = 40; // Number of items to load on scroll
        let isSearchActive = false; // Track if search is active
        let isFeaturedOnly = true; // Track if featured filter is active (default: true)
        let customTerm = ''; // Store custom term for replacement
        let customArticle = 'a'; // Store article (a/an) for custom term

        // Load styles from JSON file
        async function loadStyles() {
            try {
                const response = await fetch('styles.json');
                if (!response.ok) {
                    throw new Error('Failed to load styles');
                }
                aiStyles = await response.json();
                currentStyles = aiStyles;
                renderGrid(aiStyles, true);
            } catch (error) {
                console.error('Error loading styles:', error);
                document.getElementById('gridContainer').innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <p class="text-red-500 text-xl">Error loading styles. Please check that styles.json exists.</p>
                    </div>
                `;
            }
        }

        let displayedItems = [];

        // Function to replace mango with custom term
        function replacePromptTerm(prompt) {
            if (!customTerm) return prompt;

            // Replace "a mango" or "an mango" with appropriate article + custom term
            let result = prompt.replace(/\b(a|an)\s+mango\b/gi, (match, article) => {
                return `${customArticle} ${customTerm}`;
            });

            // Also replace standalone "mango" that might not have an article
            result = result.replace(/\bmango\b/gi, customTerm);

            return result;
        }

        function createStyleCard(style) {
            const displayPrompt = replacePromptTerm(style.prompt);
            return `
                <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300 flex flex-col">
                    <div class="aspect-square overflow-hidden bg-gray-200 cursor-pointer" onclick="openModal('${style.image}', '${style.name.replace(/'/g, "\\'")}')">
                        <img src="${style.image}" alt="${style.name}" loading="lazy" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300">
                    </div>
                    <div class="p-3 flex-1 flex flex-col">
                        <h3 class="text-lg font-bold text-gray-900 mb-1 flex items-center justify-between">
                            <span>${style.name}</span>
                            ${style.featured === 'yes' ? '<span class="text-xl">🌟</span>' : ''}
                        </h3>
                        <p class="text-gray-600 text-xs mb-2 flex-1">${style.description}</p>
                        <div class="mt-auto">
                            <p class="text-xs text-gray-500 font-semibold mb-1">PROMPT:</p>
                            <div class="relative group">
                                <p class="text-xs text-gray-700 italic bg-gray-50 p-2 pr-8 rounded">${displayPrompt}</p>
                                <button
                                    onclick="copyPrompt(this, \`${displayPrompt.replace(/`/g, '\\`').replace(/\\/g, '\\\\')}\`)"
                                    class="copy-btn absolute top-1 right-1 p-1 text-gray-400 hover:text-gray-600 hover:bg-gray-200 rounded transition-colors"
                                    title="Copy prompt"
                                >
                                    <svg class="w-3 h-3 copy-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                                    </svg>
                                    <svg class="w-3 h-3 check-icon hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function createAdCard() {
            return `
                <div class="bg-gradient-to-br from-gray-100 to-gray-200 rounded-lg shadow-md overflow-hidden flex items-center justify-center min-h-[400px]">
                    <div class="text-center p-8">
                        <p class="text-gray-400 text-sm mb-2">Advertisement</p>
                        <p class="text-gray-500 font-semibold">Google Ad Placement</p>
                        <p class="text-gray-400 text-xs mt-2">Your ad code goes here</p>
                    </div>
                </div>
            `;
        }

        function renderGrid(styles, isInitial = false) {
            const container = document.getElementById('gridContainer');
            const noResults = document.getElementById('noResults');
            const resultsCount = document.getElementById('resultsCount');

            currentStyles = styles;

            if (styles.length === 0) {
                container.innerHTML = '';
                noResults.classList.remove('hidden');
                resultsCount.textContent = '';
                displayedCount = 0;
                return;
            }

            noResults.classList.add('hidden');

            // Update results count with total
            if (isSearchActive || isFeaturedOnly) {
                resultsCount.textContent = `Showing ${styles.length} of ${aiStyles.length} styles`;
            } else {
                resultsCount.textContent = `Showing ${styles.length} style${styles.length !== 1 ? 's' : ''}`;
            }

            // If search is active, show all results immediately
            if (isSearchActive) {
                displayedCount = styles.length;
                let html = '';
                let itemCount = 0;

                styles.forEach((style, index) => {
                    if (itemCount > 0 && itemCount % 19 === 0) {
                        html += createAdCard();
                    }
                    html += createStyleCard(style);
                    itemCount++;
                });

                container.innerHTML = html;
                return;
            }

            // For initial load or no search, use lazy loading
            if (isInitial) {
                displayedCount = 0;
                container.innerHTML = '';
            }

            loadMoreItems();
        }

        function loadMoreItems() {
            const container = document.getElementById('gridContainer');
            const itemsToLoad = Math.min(LOAD_MORE, currentStyles.length - displayedCount);

            if (itemsToLoad <= 0) return;

            let html = '';
            const startIndex = displayedCount;
            const endIndex = displayedCount + itemsToLoad;

            for (let i = startIndex; i < endIndex; i++) {
                // Insert ad every 19 items (after positions 18, 37, 56, etc.)
                if (i > 0 && i % 19 === 0) {
                    html += createAdCard();
                }
                html += createStyleCard(currentStyles[i]);
            }

            container.insertAdjacentHTML('beforeend', html);
            displayedCount = endIndex;

            // Set up observer for the last item if there are more items to load
            if (displayedCount < currentStyles.length) {
                observeLastItem();
            }
        }

        let observer = null;

        function observeLastItem() {
            // Disconnect previous observer if it exists
            if (observer) {
                observer.disconnect();
            }

            // Create new observer
            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && displayedCount < currentStyles.length) {
                        loadMoreItems();
                    }
                });
            }, {
                rootMargin: '200px' // Start loading 200px before reaching the bottom
            });

            // Observe the last card in the grid
            const cards = document.querySelectorAll('#gridContainer > div');
            if (cards.length > 0) {
                observer.observe(cards[cards.length - 1]);
            }
        }

        function searchStyles(query) {
            const lowerQuery = query.toLowerCase().trim();

            let filtered = aiStyles;

            // Apply featured filter
            if (isFeaturedOnly) {
                filtered = filtered.filter(style => style.featured === 'yes');
            }

            // Apply search filter
            if (lowerQuery !== '') {
                filtered = filtered.filter(style => {
                    return style.name.toLowerCase().includes(lowerQuery) ||
                           style.description.toLowerCase().includes(lowerQuery) ||
                           style.prompt.toLowerCase().includes(lowerQuery);
                });
            }

            return filtered;
        }

        // Event listener for search
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value;
            isSearchActive = query.trim() !== '';
            const results = searchStyles(query);
            renderGrid(results, true);
        });

        // Event listener for featured toggle
        document.getElementById('featuredToggle').addEventListener('change', (e) => {
            isFeaturedOnly = e.target.checked;
            const query = document.getElementById('searchInput').value;
            isSearchActive = query.trim() !== '';
            const results = searchStyles(query);
            renderGrid(results, true);
        });

        // Copy prompt function
        function copyPrompt(button, prompt) {
            navigator.clipboard.writeText(prompt).then(() => {
                const copyIcon = button.querySelector('.copy-icon');
                const checkIcon = button.querySelector('.check-icon');

                // Hide copy icon, show check icon
                copyIcon.classList.add('hidden');
                checkIcon.classList.remove('hidden');
                button.classList.add('text-green-500');
                button.classList.remove('text-gray-400');

                // Reset after 2 seconds
                setTimeout(() => {
                    copyIcon.classList.remove('hidden');
                    checkIcon.classList.add('hidden');
                    button.classList.remove('text-green-500');
                    button.classList.add('text-gray-400');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        }

        // Modal functions
        function openModal(imageSrc, imageName) {
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            const modalCaption = document.getElementById('modalCaption');

            modalImage.src = imageSrc;
            modalImage.alt = imageName;
            modalCaption.textContent = imageName;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.add('hidden');
            document.body.style.overflow = ''; // Restore scrolling
        }

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                closeSidebar();
            }
        });

        // Sidebar functions
        function openSidebar() {
            const sidebar = document.getElementById('settingsSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.remove('translate-x-full');
            overlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            const sidebar = document.getElementById('settingsSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.add('translate-x-full');
            overlay.classList.add('hidden');
            document.body.style.overflow = '';
        }

        // Function to determine article (a/an)
        function getArticle(word) {
            const vowels = ['a', 'e', 'i', 'o', 'u'];
            return vowels.includes(word.charAt(0).toLowerCase()) ? 'an' : 'a';
        }

        // Settings button event listener
        document.getElementById('settingsBtn').addEventListener('click', openSidebar);
        document.getElementById('closeSidebar').addEventListener('click', closeSidebar);
        document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

        // Apply custom term
        document.getElementById('applyCustomTerm').addEventListener('click', () => {
            const term = document.getElementById('customTerm').value.trim();
            if (term) {
                customTerm = term;
                customArticle = getArticle(term);
                // Re-render grid with new term
                renderGrid(currentStyles, true);
                closeSidebar();
            }
        });

        // Reset custom term
        document.getElementById('resetCustomTerm').addEventListener('click', () => {
            customTerm = '';
            customArticle = 'a';
            document.getElementById('customTerm').value = '';
            // Re-render grid with original prompts
            renderGrid(currentStyles, true);
            closeSidebar();
        });

        // Add gleam effect on load
        window.addEventListener('load', () => {
            const featuredLabel = document.getElementById('featuredLabel');
            featuredLabel.classList.add('gleam-effect');
            setTimeout(() => {
                featuredLabel.classList.remove('gleam-effect');
            }, 2000);
        });

        // Initial render
        loadStyles();
    </script>
</body>
</html>
